name: Build Yuehong APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Source Code
      run: unzip yuehong-privilege-assistant-main.zip

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'zulu'

    - name: Setup Android SDK and NDKs
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;29.0.13113456" "ndk;27.3.13750724"

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

    - name: Grant execute permission for gradlew
      working-directory: ./yuehong-privilege-assistant-main
      run: chmod +x gradlew

    - name: Build with Gradle
      working-directory: ./yuehong-privilege-assistant-main
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Yuehong-Debug-APK
        path: yuehong-privilege-assistant-main/manager/build/outputs/apk/debug/*.apk
