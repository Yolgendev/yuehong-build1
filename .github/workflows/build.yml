name: Build Yuehong APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Source Code
      run: unzip yuehong-privilege-assistant-main.zip

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'zulu'

    - name: Setup Android SDK and NDKs
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.3.13750724"
        
        NDK_BIN_DIR="$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin"
        
        # 暴力填补 cc-rs 强行拼出 .cmd 后缀的坑，它要什么就给什么
        cp -a "$NDK_BIN_DIR/aarch64-linux-android34-clang" "$NDK_BIN_DIR/aarch64-linux-android34-clang.cmd"
        cp -a "$NDK_BIN_DIR/armv7a-linux-androideabi34-clang" "$NDK_BIN_DIR/armv7a-linux-androideabi34-clang.cmd"
        cp -a "$NDK_BIN_DIR/x86_64-linux-android34-clang" "$NDK_BIN_DIR/x86_64-linux-android34-clang.cmd"
        chmod +x "$NDK_BIN_DIR/"*clang.cmd
        
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.3.13750724" >> $GITHUB_ENV
        
        # 强制把环境变量写进全局，防止被 Gradle 子进程吞掉
        echo "CC_aarch64_linux_android=$NDK_BIN_DIR/aarch64-linux-android24-clang" >> $GITHUB_ENV
        echo "AR_aarch64_linux_android=$NDK_BIN_DIR/llvm-ar" >> $GITHUB_ENV
        echo "CXX_aarch64_linux_android=$NDK_BIN_DIR/aarch64-linux-android24-clang++" >> $GITHUB_ENV
        echo "CC_armv7_linux_androideabi=$NDK_BIN_DIR/armv7a-linux-androideabi24-clang" >> $GITHUB_ENV
        echo "AR_armv7_linux_androideabi=$NDK_BIN_DIR/llvm-ar" >> $GITHUB_ENV
        echo "CXX_armv7_linux_androideabi=$NDK_BIN_DIR/armv7a-linux-androideabi24-clang++" >> $GITHUB_ENV
        echo "CC_x86_64_linux_android=$NDK_BIN_DIR/x86_64-linux-android24-clang" >> $GITHUB_ENV
        echo "AR_x86_64_linux_android=$NDK_BIN_DIR/llvm-ar" >> $GITHUB_ENV
        echo "CXX_x86_64_linux_android=$NDK_BIN_DIR/x86_64-linux-android24-clang++" >> $GITHUB_ENV

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

    - name: Grant execute permission for gradlew
      working-directory: ./yuehong-privilege-assistant-main
      run: chmod +x gradlew

    - name: Build with Gradle
      working-directory: ./yuehong-privilege-assistant-main
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Yuehong-Debug-APK
        path: yuehong-privilege-assistant-main/manager/build/outputs/apk/debug/*.apk
