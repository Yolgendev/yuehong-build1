name: Build Yuehong APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Source Code
      run: unzip yuehong-privilege-assistant-main.zip

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'zulu'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      working-directory: ./yuehong-privilege-assistant-main
      run: chmod +x gradlew

    - name: Build with Gradle
      working-directory: ./yuehong-privilege-assistant-main
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Yuehong-Debug-APK
        path: yuehong-privilege-assistant-main/manager/build/outputs/apk/debug/*.apk
